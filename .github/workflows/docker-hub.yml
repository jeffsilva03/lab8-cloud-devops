
name: CI/CD - FastAPI Docker Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Build:
    name: Compilar e Testar Projeto
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Executar testes
        run: |
          PYTHONPATH=. python -m pytest tests/ -v --tb=short

  Imagem:
    name: Publicar Imagem Docker
    runs-on: ubuntu-latest
    needs: Build
    if: github.event_name == 'push'

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            jeffsilva03/lab8-fastapi:latest
            jeffsilva03/lab8-fastapi:${{ github.sha }}


  Deploy:
    name: Deploy AWS EC2
    runs-on: ubuntu-latest
    needs: Imagem
    if: github.event_name == 'push'

    steps:
      - name: Atualizar aplicacao na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: SHA256:4ZrT7Jh+h4KkZgodHTtdWgGH7TxgmrIN+Yu8bHH38W0
          script: |
            set -e

            echo "Baixando nova imagem..."
            sudo docker pull jeffsilva03/lab8-fastapi:${{ github.sha }}

            echo "Parando container anterior..."
            sudo docker stop lab8-fastapi || true
            sudo docker rm lab8-fastapi || true

            echo "Iniciando novo container..."
            sudo docker run -d \
              --name lab8-fastapi \
              --restart unless-stopped \
              -p 8080:8080 \
              jeffsilva03/lab8-fastapi:${{ github.sha }}

            echo "Verificando API..."
            sleep 5
            curl --fail http://localhost:8080/health

            echo "Deploy concluido!"
