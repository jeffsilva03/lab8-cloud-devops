
name: CI/CD - FastAPI Docker Hub e AWS EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ==========================================
  # JOB 1 - Testes automatizados
  # ==========================================
  Build:
    name: Compilar e Testar Projeto
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx

      - name: Executar testes
        run: |
          PYTHONPATH=. python -m pytest tests/ -v --tb=short

  # ==========================================
  # JOB 2 - Publicar imagem no Docker Hub
  # ==========================================
  Imagem:
    name: Publicar Imagem Docker
    runs-on: ubuntu-latest
    needs: Build
    if: github.event_name == 'push'

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            jeffsilva03/lab8-fastapi:latest
            jeffsilva03/lab8-fastapi:${{ github.sha }}

  # ==========================================
  # JOB 3 - Deploy automatico na AWS EC2
  # ==========================================
  Deploy:
    name: Deploy AWS EC2
    runs-on: ubuntu-latest
    needs: Imagem
    if: github.event_name == 'push'

    steps:
      - name: Configurar SSH seguro
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -T 15 -t ed25519 "$EC2_HOST" > ~/.ssh/known_hosts

          ACTUAL=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')
          EXPECTED="SHA256:4ZrT7Jh+h4KkZgodHTtdWgGH7TxgmrIN+Yu8bHH38W0"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERRO: Fingerprint SSH nao corresponde."
            exit 1
          fi

          chmod 600 ~/.ssh/known_hosts
          echo "Identidade SSH validada."

      - name: Atualizar aplicacao na EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$EC2_USERNAME@$EC2_HOST" 'bash -se' <<'REMOTE'
          set -e

          echo "Baixando imagem Docker..."
          sudo docker pull jeffsilva03/lab8-fastapi:${{ github.sha }}

          echo "Parando container anterior..."
          sudo docker stop lab8-fastapi 2>/dev/null || true
          sudo docker rm lab8-fastapi 2>/dev/null || true

          echo "Iniciando nova versao..."
          sudo docker run -d \
            --name lab8-fastapi \
            --restart unless-stopped \
            -p 8080:8080 \
            jeffsilva03/lab8-fastapi:${{ github.sha }}

          echo "Executando health check..."
          for i in $(seq 1 12); do
            if curl --fail --silent http://localhost:8080/health; then
              echo ""
              echo "Deploy concluido com sucesso!"
              exit 0
            fi
            sleep 2
          done

          echo "ERRO: API nao respondeu ao health check."
          sudo docker logs --tail 30 lab8-fastapi
          exit 1
          REMOTE
